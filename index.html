<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Solar System Experience</title><style>*{box-sizing:border-box}body{margin:0;background:#030611;color:#fff;font-family:system-ui;overflow:hidden}canvas{display:block}.intro{position:fixed;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#4a2a5b88,#100e27ed 50%,#030611)}.inner{max-width:600px}.eyebrow{color:#b9a6ff;letter-spacing:.2em;font-size:11px}.intro h1{font-size:clamp(44px,9vw,78px);line-height:.95;margin:16px 0;letter-spacing:-.06em}.intro p{color:#c5c4df;line-height:1.6}.btn{border:1px solid #ffffff50;border-radius:28px;padding:12px 17px;background:#ffffff12;color:white;font-weight:700}.primary{background:#f6c86a;color:#21162b}.hud{display:none;position:fixed;z-index:1;inset:14px;justify-content:space-between;align-items:start;font-size:11px;pointer-events:none}.hud button{pointer-events:auto;margin-left:4px}.search{position:fixed;z-index:9999;top:76px;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 30px));display:flex;gap:6px;padding:7px;border:1px solid #ffffff45;border-radius:32px;background:#080b1fee;box-shadow:0 8px 28px #0009}.search input{min-width:0;flex:1;border:0;border-radius:24px;padding:12px 16px;background:transparent;color:white;outline:none;font-size:15px}.search input::placeholder{color:#bcb9d2}.search button{white-space:nowrap}.info{display:none;position:fixed;z-index:1;bottom:15px;left:15px;padding:12px 15px;border-radius:14px;background:#090b1dcc;border:1px solid #ffffff30;max-width:260px}.info span{display:block;color:#c5c4df;font-size:12px}</style></head><body><div class="intro" id="intro"><div class="inner"><div class="eyebrow">AN IMMERSIVE JOURNEY</div><h1>Our Solar<br><span style="color:#f6c86a">System</span></h1><p>Enter a cinematic, interactive solar system. Move your phone or drag to look around from a close Sun-side viewpoint.</p><button class="btn primary" id="enter">ENTER EXPERIENCE</button></div></div><div class="hud" id="hud"><span>OUR SOLAR SYSTEM</span><span><button class="btn" id="motion">Enable motion</button><button class="btn" id="pause">Pause</button><button class="btn" id="exit">Exit</button></span></div><form class="search" id="searchForm"><input id="planetSearch" list="planetNames" placeholder="Find a planet… (e.g. Saturn)" autocomplete="off"><datalist id="planetNames"><option>Mercury</option><option>Venus</option><option>Earth</option><option>Mars</option><option>Jupiter</option><option>Saturn</option><option>Uranus</option><option>Neptune</option></datalist><button class="btn primary" type="submit">Go</button></form><div class="info" id="info"><b>Welcome, explorer</b><span>Tap a planet to learn about it.</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#030611');scene.fog=new THREE.FogExp2('#100b24',.002);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1500);camera.position.set(0,2.5,7);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8888bb,.65));const light=new THREE.PointLight(0xffb84c,95,100);scene.add(light);
const sun=new THREE.Mesh(new THREE.SphereGeometry(.48,48,32),new THREE.MeshBasicMaterial({color:0xffd45b}));scene.add(sun);
const glow=new THREE.Mesh(new THREE.SphereGeometry(.8,32,32),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'varying vec3 vN; void main(){vN=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 vN;void main(){float a=pow(1.-abs(normalize(vN).z),2.);gl_FragColor=vec4(1.,.38,.08,a*.42);}'}));scene.add(glow);
const starPositions=[];for(let i=0;i<3000;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(25+Math.random()*650);starPositions.push(v.x,v.y,v.z)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xcbd5ff,size:.8,sizeAttenuation:false})));
const data=[['Mercury',0xa9a49b,.11,1.15,88,'Smallest planet, closest to the Sun.'],['Venus',0xe8c28d,.17,1.65,225,'A dense atmosphere makes Venus the hottest planet.'],['Earth',0x398bff,.18,2.15,365,'Our home world, with liquid surface water.'],['Mars',0xd86f4d,.14,2.7,687,'The red planet, with giant volcanoes.'],['Jupiter',0xd8b18b,.42,3.45,4333,'The largest planet, with the Great Red Spot.'],['Saturn',0xe8d39a,.36,4.25,10759,'A gas giant with broad rings of ice and rock.'],['Uranus',0x8ad9df,.25,5.15,30687,'An ice giant that rotates dramatically tilted.'],['Neptune',0x416dff,.24,6.1,60190,'A distant ice giant with supersonic winds.']];
const orbiters=[],pickables=[];data.forEach(([name,color,size,r,period,fact])=>{const points=[];for(let i=0;i<240;i++){let a=i/240*Math.PI*2;points.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r))}scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x9785b5,transparent:true,opacity:.4})));const pivot=new THREE.Group();scene.add(pivot);const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,32,24),new THREE.MeshStandardMaterial({color,roughness:.8}));mesh.position.x=r;mesh.userData={name,fact};pivot.add(mesh);pickables.push(mesh);if(name==='Saturn'){const ring=new THREE.Mesh(new THREE.RingGeometry(size*1.3,size*1.9,64),new THREE.MeshBasicMaterial({color:0xd6c49d,side:THREE.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.x=r;pivot.add(ring)}orbiters.push({pivot,period})});
// Dust and small debris follow near-Keplerian orbits around the Sun.
const dustCount=2200,dustElements=[],dustPositions=new Float32Array(dustCount*3),dustGeometry=new THREE.BufferGeometry();
for(let i=0;i<dustCount;i++){const a=2.88+Math.random()*.5,e=Math.random()*.075,phase=Math.random()*Math.PI*2,inclination=(Math.random()-.5)*.12,node=Math.random()*Math.PI*2;dustElements.push({a,e,phase,inclination,node,rate:.16*Math.pow(2.15/a,1.5)*(0.82+Math.random()*.36),size:.018+Math.random()*.03});}
dustGeometry.setAttribute('position',new THREE.BufferAttribute(dustPositions,3));const dustMaterial=new THREE.PointsMaterial({color:0xcbbd9e,size:.035,transparent:true,opacity:.78,sizeAttenuation:true});const dustCloud=new THREE.Points(dustGeometry,dustMaterial);scene.add(dustCloud);
function updateDust(dt){for(let i=0;i<dustCount;i++){const p=dustElements[i];p.phase+=dt*p.rate;const theta=p.phase,r=p.a*(1-p.e*p.e)/(1+p.e*Math.cos(theta)),x=r*Math.cos(theta),z=r*Math.sin(theta),y=Math.sin(theta)*Math.sin(p.inclination)*r,cn=Math.cos(p.node),sn=Math.sin(p.node),j=i*3;dustPositions[j]=x*cn-z*sn;dustPositions[j+1]=y;dustPositions[j+2]=x*sn+z*cn;}dustGeometry.attributes.position.needsUpdate=true;}
let active=false,paused=false,drag=false,lastX=0,lastY=0,yaw=0,pitch=-.18,motion=false;const intro=document.querySelector('#intro'),hud=document.querySelector('#hud'),info=document.querySelector('#info'),searchForm=document.querySelector('#searchForm');document.querySelector('#enter').onclick=()=>{active=true;intro.style.display='none';hud.style.display='flex';searchForm.style.display='flex';info.style.display='block'};document.querySelector('#exit').onclick=()=>{active=false;intro.style.display='grid';hud.style.display='none';searchForm.style.display='flex';info.style.display='none'};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#motion').onclick=async()=>{try{if(DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()!=='granted')throw 0}motion=true;e.target.textContent='Motion on'}catch{info.innerHTML='<b>Motion unavailable</b><span>Use touch-drag to look around.</span>'}};
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY};onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY}};const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.onclick=e=>{pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(pickables)[0];if(hit){const d=hit.object.userData;info.innerHTML='<b>'+d.name+'</b><span>'+d.fact+'</span>'}};
let cameraFlight=null;searchForm.onsubmit=e=>{e.preventDefault();if(!active){active=true;intro.style.display='none';hud.style.display='flex';info.style.display='block'}const q=document.querySelector('#planetSearch').value.trim().toLowerCase();const i=data.findIndex(d=>d[0].toLowerCase()===q);if(i<0){info.innerHTML='<b>Planet not found</b><span>Try one of the eight planet names.</span>';return}cameraFlight={index:i,elapsed:0,duration:2.4,startPosition:camera.position.clone()};info.innerHTML='<b>'+data[i][0]+'</b><span>'+data[i][5]+'</span>';motion=false;document.querySelector('#motion').textContent='Enable motion';};let prev=performance.now();function frame(t){requestAnimationFrame(frame);let dt=Math.min((t-prev)/1000,.05);prev=t;if(!paused){orbiters.forEach(o=>o.pivot.rotation.y+=dt*.16*365/o.period);updateDust(dt);}if(active){if(cameraFlight){cameraFlight.elapsed=Math.min(cameraFlight.duration,cameraFlight.elapsed+dt);const u=cameraFlight.elapsed/cameraFlight.duration,k=u*u*(3-2*u),obj=pickables[cameraFlight.index],planetPos=new THREE.Vector3();obj.getWorldPosition(planetPos);const away=planetPos.clone().normalize();if(away.lengthSq()<.001)away.set(0,0,1);const endPos=planetPos.clone().add(away.multiplyScalar(Math.max(1.15,data[cameraFlight.index][2]*5.5))).add(new THREE.Vector3(0,.35,0));camera.position.lerpVectors(cameraFlight.startPosition,endPos,k);const lookTarget=planetPos.clone().lerp(planetPos.clone().add(new THREE.Vector3(0,.08,0)),k);camera.lookAt(lookTarget);if(u>=1){cameraFlight=null;const euler=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');yaw=euler.y;pitch=euler.x}}else{camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}}renderer.render(scene,camera)}frame(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('deviceorientation',e=>{if(motion&&e.alpha!==null){yaw=-e.alpha*Math.PI/180;pitch=Math.max(-1,Math.min(1,-(e.beta||0)*Math.PI/360))}});
</script></body></html>
