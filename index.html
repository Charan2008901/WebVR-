<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Solar System VR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030611;color:#f6f3ff;font-family:system-ui,sans-serif}canvas{display:block}.intro{position:fixed;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 48%,#4a2a5b80,#100e27ee 48%,#030611)}.intro-inner{max-width:620px}.eyebrow{color:#b9a6ff;letter-spacing:.22em;font-size:11px;font-weight:800}.intro h1{font-size:clamp(42px,9vw,78px);line-height:.94;letter-spacing:-.06em;margin:16px 0}.intro p{color:#c5c4df;line-height:1.65;margin:0 auto 24px}.btn{border:1px solid #ffffff50;border-radius:28px;padding:12px 17px;background:#ffffff10;color:white;font-weight:750}.primary{background:#f6c86a;color:#21162b;border-color:#f6c86a}.hud{position:fixed;z-index:2;inset:14px 14px auto;display:none;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.1em;text-shadow:0 1px 8px #000;pointer-events:none}.hud button{pointer-events:auto;margin-left:5px}.fact{position:fixed;z-index:2;bottom:16px;left:14px;max-width:260px;padding:12px 14px;border:1px solid #ffffff30;border-radius:14px;background:#090b1dcc;display:none;backdrop-filter:blur(10px)}.fact strong{display:block;margin-bottom:4px}.fact span{color:#c5c4df;font-size:12px;line-height:1.45}.hint{position:fixed;bottom:15px;right:14px;color:#ddd;font-size:10px;display:none}@media(max-width:600px){.intro p{font-size:14px}.fact{max-width:215px}}
</style></head><body>
<div class="intro" id="intro"><div class="intro-inner"><div class="eyebrow">AN IMMERSIVE JOURNEY</div><h1>Our Solar<br><span style="color:#f6c86a">System</span></h1><p>Enter the scene from a close, Sun-side viewpoint. Move your phone or drag to look around the Sun, planets, orbital paths, asteroid belt, and star field.</p><button class="btn primary" id="enter">ENTER EXPERIENCE</button></div></div>
<div class="hud" id="hud"><span>SOLAR SYSTEM · THREE.JS</span><span><button class="btn" id="motion">Enable motion</button><button class="btn" id="pause">Pause</button><button class="btn" id="exit">Exit</button></span></div>
<div class="fact" id="fact"><strong>Welcome, explorer</strong><span>Tap a planet to discover it.</span></div><div class="hint" id="hint">Drag to look · Tap a planet</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030611);scene.fog=new THREE.FogExp2(0x030611,.002);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,2500);camera.position.set(0,3.1,7.5);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x9da8ff,.5));const sunLight=new THREE.PointLight(0xffbd58,140,160);scene.add(sunLight);
const sun=new THREE.Mesh(new THREE.SphereGeometry(.48,48,32),new THREE.MeshBasicMaterial({color:0xffd95e}));scene.add(sun);const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,2,64,64,64);g.addColorStop(0,'rgba(255,214,95,.65)');g.addColorStop(1,'rgba(255,140,30,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})(),transparent:true,depthWrite:false}));glow.scale.set(3.5,3.5,1);scene.add(glow);
const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<2800;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(35+Math.random()*850);starPos.push(v.x,v.y,v.z)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcdd7ff,size:.7,sizeAttenuation:false})));
const defs=[['Mercury',0xa9a49b,.075,1.15,88,'Smallest planet, closest to the Sun.'],['Venus',0xe8c28d,.12,1.65,225,'A dense atmosphere makes Venus the hottest planet.'],['Earth',0x398bff,.13,2.15,365,'Our home world, with liquid surface water.'],['Mars',0xd86f4d,.105,2.7,687,'The red planet, with giant volcanoes and ancient valleys.'],['Jupiter',0xd8b18b,.34,3.45,4333,'The largest planet, known for its Great Red Spot.'],['Saturn',0xe8d39a,.29,4.25,10759,'A gas giant surrounded by broad rings of ice and rock.'],['Uranus',0x8ad9df,.21,5.15,30687,'An ice giant that rotates dramatically tilted.'],['Neptune',0x416dff,.2,6.1,60190,'A distant ice giant with supersonic winds.']];
const planetMeshes=[],orbitGroups=[];
defs.forEach(([name,color,size,r,days,fact],i)=>{const group=new THREE.Group();scene.add(group);orbitGroups.push({group,r,days});const curve=new THREE.EllipseCurve(0,0,r,r,0,Math.PI*2,false,0);const pts=curve.getPoints(180).map(p=>new THREE.Vector3(p.x,0,p.y));const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x9d8cb9,transparent:true,opacity:.34}));scene.add(line);const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,32,24),new THREE.MeshStandardMaterial({color,roughness:.8,metalness:.02}));mesh.position.set(r,0,0);mesh.userData={name,fact};group.add(mesh);planetMeshes.push(mesh);if(name==='Saturn'){const ring=new THREE.Mesh(new THREE.RingGeometry(size*1.25,size*1.85,64),new THREE.MeshStandardMaterial({color:0xd6c49d,side:THREE.DoubleSide,transparent:true,opacity:.85}));ring.rotation.x=-Math.PI/2;ring.position.x=r;group.add(ring)}});
const beltGeo=new THREE.BufferGeometry(),belt=[];for(let i=0;i<1300;i++){const a=Math.random()*Math.PI*2,r=2.9+Math.random()*.45;belt.push(Math.cos(a)*r,(Math.random()-.5)*.09,Math.sin(a)*r)}beltGeo.setAttribute('position',new THREE.Float32BufferAttribute(belt,3));scene.add(new THREE.Points(beltGeo,new THREE.PointsMaterial({color:0xb6a58d,size:.035})));
let active=false,paused=false,drag=false,lastX=0,lastY=0,yaw=0,pitch=-.18,deviceOn=false;const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const intro=document.querySelector('#intro'),hud=document.querySelector('#hud'),factBox=document.querySelector('#fact'),hint=document.querySelector('#hint');
function enter(){active=true;intro.style.display='none';hud.style.display='flex';factBox.style.display='block';hint.style.display='block'}
document.querySelector('#enter').onclick=enter;document.querySelector('#exit').onclick=()=>{active=false;intro.style.display='grid';hud.style.display='none';factBox.style.display='none';hint.style.display='none'};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
document.querySelector('#motion').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error()}deviceOn=true;document.querySelector('#motion').textContent='Motion on';factBox.innerHTML='<strong>Motion enabled</strong><span>Turn your phone to look around; drag still works.</span>'}catch{factBox.innerHTML='<strong>Motion unavailable</strong><span>Allow motion access, or drag the scene to look around.</span>'}};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{drag=false;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(planetMeshes)[0];if(hit){const d=hit.object.userData;factBox.innerHTML='<strong>'+d.name+'</strong><span>'+d.fact+'</span>'}});
let orientation={alpha:0,beta:0,gamma:0};window.addEventListener('deviceorientation',e=>{if(deviceOn&&e.alpha!==null)orientation={alpha:e.alpha*Math.PI/180,beta:(e.beta||0)*Math.PI/180,gamma:(e.gamma||0)*Math.PI/180}});
function animate(t){requestAnimationFrame(animate);if(!paused)orbitGroups.forEach(o=>o.group.rotation.y+=.00025*(365/o.days));if(active){if(deviceOn&&!drag){yaw=-orientation.alpha;pitch=Math.max(-1.2,Math.min(1.2,-orientation.beta*.5))}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
