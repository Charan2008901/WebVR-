<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Solar System VR</title><script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#030611;color:#f6f3ff;font-family:system-ui,sans-serif;overflow:hidden}a-scene{position:fixed;inset:0}.intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 48%,#4a2a5b80 0%,#100e27ee 48%,#030611 100%)}.intro-inner{max-width:620px}.eyebrow{color:#b9a6ff;letter-spacing:.22em;font-size:11px;font-weight:800}.intro h1{font-size:clamp(42px,9vw,78px);line-height:.94;letter-spacing:-.06em;margin:16px 0}.intro p{color:#c5c4df;line-height:1.65;max-width:520px;margin:0 auto 24px}.button{border:1px solid #ffffff50;border-radius:28px;padding:13px 22px;background:#ffffff10;color:white;font-weight:750;font-size:14px}.button.primary{background:#f6c86a;color:#21162b;border-color:#f6c86a}.hud{position:fixed;z-index:2;inset:18px 20px auto;display:none;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;text-shadow:0 1px 8px #000}.hud button{margin-left:8px}.fact{position:fixed;z-index:2;bottom:20px;left:20px;max-width:300px;padding:14px 16px;border:1px solid #ffffff30;border-radius:14px;background:#090b1dcc;display:none;backdrop-filter:blur(10px)}.fact strong{display:block;margin-bottom:5px}.fact span{color:#c5c4df;font-size:13px;line-height:1.5}@media(max-width:600px){.intro p{font-size:14px}.hud{inset:12px}.fact{bottom:12px;left:12px;max-width:220px}}
</style></head><body>
<div class="intro" id="intro"><div class="intro-inner"><div class="eyebrow">AN IMMERSIVE JOURNEY</div><h1>Our Solar<br><span style="color:#f6c86a">System</span></h1><p>Explore the Sun and all eight planets, surrounded by stars, glowing orbital paths, and the asteroid belt. Enter the experience, then move your phone or drag to look around.</p><button class="button primary" id="enter">ENTER VR EXPERIENCE</button></div></div>
<div class="hud" id="hud"><span>SOLAR SYSTEM · LIVE ORBITS</span><span><button class="button" id="motion">Enable motion</button><button class="button" id="exit">Exit</button></span></div><div class="fact" id="fact"><strong>Welcome, explorer</strong><span>Tap a planet to discover it.</span></div>
<a-scene embedded vr-mode-ui="enabled:true" renderer="colorManagement:true;antialias:true" background="color:#030611">
<a-entity id="rig" position="0 0 0"><a-camera position="0 0 24" look-controls="magicWindowTrackingEnabled:true" wasd-controls-enabled="false"></a-camera></a-entity>
<a-sky color="#030611"></a-sky><a-entity light="type:ambient;color:#b9b9ff;intensity:.42"></a-entity><a-entity light="type:point;color:#ffd16a;intensity:3.4;distance:100" position="0 0 0"></a-entity>
<a-entity id="stars"></a-entity><a-sphere radius="1.05" material="shader:standard;color:#ffd45e;emissive:#ff9b28;emissiveIntensity:2.3"></a-sphere><a-sphere radius="1.38" material="color:#ffbd4a;opacity:.11;transparent:true;side:double"></a-sphere>
<a-entity id="world"></a-entity><a-entity id="belt"></a-entity>
</a-scene>
<script>
const scene=document.querySelector('a-scene'),intro=document.querySelector('#intro'),hud=document.querySelector('#hud'),fact=document.querySelector('#fact');
document.querySelector('#enter').onclick=()=>{intro.style.display='none';hud.style.display='flex';fact.style.display='block';};
document.querySelector('#exit').onclick=()=>{intro.style.display='grid';hud.style.display='none';fact.style.display='none';};
document.querySelector('#motion').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw 0;}fact.innerHTML='<strong>Motion controls ready</strong><span>Turn or tilt your phone to look around. Drag to look with touch.</span>';document.querySelector('#motion').textContent='Motion on';}catch(e){fact.innerHTML='<strong>Motion permission unavailable</strong><span>Use touch-drag to look around, or allow motion access in browser settings.</span>'}};
const planets=[
['Mercury','#a9a49b',.13,2.05,88,'Smallest planet; closest to the Sun.'],
['Venus','#e8c28d',.21,2.8,225,'A dense atmosphere makes Venus the hottest planet.'],
['Earth','#398bff',.23,3.6,365,'Our home world, with liquid surface water.'],
['Mars','#d86f4d',.18,4.45,687,'The red planet, with giant volcanoes and ancient river valleys.'],
['Jupiter','#d8b18b',.57,5.65,4333,'The largest planet, famous for its Great Red Spot.'],
['Saturn','#e8d39a',.49,7.05,10759,'A gas giant surrounded by broad rings of ice and rock.'],
['Uranus','#8ad9df',.35,8.5,30687,'An ice giant that spins dramatically tilted.'],
['Neptune','#416dff',.34,10.0,60190,'A distant ice giant with supersonic winds.']];
const world=document.querySelector('#world');
planets.forEach(([name,color,size,r,days],i)=>{const orbit=document.createElement('a-entity');orbit.setAttribute('rotation',`0 0 ${i%2? -5:5}`);const path=document.createElement('a-torus');path.setAttribute('radius',r);path.setAttribute('radius-tubular','.009');path.setAttribute('rotation','90 0 0');path.setAttribute('material','color:#b7a9d7;opacity:.35;transparent:true');orbit.append(path);const pivot=document.createElement('a-entity');pivot.setAttribute('animation',`property:rotation;to:0 360 0;dur:${Math.max(18000,days*220)};easing:linear;loop:true`);const p=document.createElement('a-sphere');p.setAttribute('position',`0 0 ${-r}`);p.setAttribute('radius',size);p.setAttribute('material',`color:${color};roughness:.75`);p.addEventListener('click',()=>{fact.innerHTML=`<strong>${name}</strong><span>${planets[i][5]}</span>`;});pivot.append(p);if(name==='Saturn'){const ring=document.createElement('a-torus');ring.setAttribute('position',`0 0 ${-r}`);ring.setAttribute('radius',size*1.65);ring.setAttribute('radius-tubular','.07');ring.setAttribute('rotation','72 0 18');ring.setAttribute('material','color:#d8c49c;opacity:.9');pivot.append(ring)}orbit.append(pivot);world.append(orbit)});
const belt=document.querySelector('#belt');for(let i=0;i<520;i++){const a=Math.random()*Math.PI*2,r=4.8+Math.random()*.75;const rock=document.createElement('a-dodecahedron');rock.setAttribute('position',`${Math.cos(a)*r} ${(Math.random()-.5)*.12} ${Math.sin(a)*r}`);rock.setAttribute('radius',.025+Math.random()*.045);rock.setAttribute('scale',`1 .5 ${.7+Math.random()}`);rock.setAttribute('rotation',`0 ${Math.random()*360} ${Math.random()*360}`);rock.setAttribute('material',`color:${Math.random()>.5?'#b9a88e':'#726d78'};roughness:1`);belt.append(rock)}
const stars=document.querySelector('#stars');for(let i=0;i<900;i++){const s=document.createElement('a-sphere');const theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1),r=18+Math.random()*35;s.setAttribute('position',`${r*Math.sin(phi)*Math.cos(theta)} ${r*Math.cos(phi)} ${r*Math.sin(phi)*Math.sin(theta)}`);s.setAttribute('radius',.012+Math.random()*.025);s.setAttribute('material',`color:${Math.random()>.9?'#c5a9ff':'#e8edff'};emissive:#9eafff;emissiveIntensity:.35`);stars.append(s)}
</script></body></html>
